<main class="screen">
  <router-outlet />
</main>

<!-- Message en bas de l'écran (avec « Annuler » après une suppression) -->
@if (ui.toast(); as toast) {
  <div class="toast" [class.error]="toast.error" role="status">
    <span>{{ toast.message }}</span>
    @if (toast.undo) {
      <button type="button" class="toast-undo" (click)="ui.undoToast()">Annuler</button>
    }
  </div>
}

<!-- Nouvelle version téléchargée (PWA) -->
@if (updateReady()) {
  <div class="toast update" role="status">
    <span>Nouvelle version de Volako</span>
    <button type="button" class="toast-undo" (click)="reload()">Mettre à jour</button>
  </div>
}

<!-- Barre de navigation flottante, bouton « + » au centre -->
<nav class="nav" aria-label="Menu principal">
  @for (t of tabs; track t.id) {
    <a
      [routerLink]="t.link"
      [class.on]="tab() === t.id"
      [class.center]="t.id === 'ajouter'"
      [attr.aria-current]="tab() === t.id ? 'page' : null"
      [attr.aria-label]="t.label"
    >
      @if (t.id === 'ajouter') {
        <!-- Disque taillé comme une pierre : même matière que le cristal de l'accueil, mais rond et immobile -->
        <span class="plus">
          <svg class="plus-gem" viewBox="0 0 60 60" aria-hidden="true">
            <defs>
              <linearGradient id="plus-liquid" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" [attr.stop-color]="plusColors().light" />
                <stop offset=".4" [attr.stop-color]="plusColors().main" />
                <stop offset="1" [attr.stop-color]="plusColors().dark" />
              </linearGradient>
              <linearGradient id="plus-rim" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" />
                <stop offset=".45" [attr.stop-color]="plusColors().main" />
                <stop offset="1" [attr.stop-color]="plusColors().dark" />
              </linearGradient>
              <linearGradient id="plus-shade" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#000" stop-opacity=".3" />
                <stop offset=".5" stop-color="#000" stop-opacity="0" />
              </linearGradient>
              <clipPath id="plus-clip"><circle cx="30" cy="30" r="29" /></clipPath>
            </defs>
            <g clip-path="url(#plus-clip)">
              <rect width="60" height="60" fill="url(#plus-liquid)" />
              <rect width="60" height="60" fill="url(#plus-shade)" />
              <!-- Facettes : haut gauche dans la lumière, bas droit dans l'ombre, table au centre -->
              <path d="M30 1 L24.6 17.1 L17.1 24.6 L1 30 A29 29 0 0 1 30 1 Z" fill="#fff" opacity=".24" />
              <path d="M59 30 L42.9 35.4 L35.4 42.9 L30 59 A29 29 0 0 0 59 30 Z" fill="#000" opacity=".22" />
              <path d="M42.9 24.6 L35.4 17.1 L24.6 17.1 L17.1 24.6 L17.1 35.4 L24.6 42.9 L35.4 42.9 L42.9 35.4 Z" fill="#fff" opacity=".1" />
            </g>
            <path
              d="M42.9 24.6 L35.4 17.1 L24.6 17.1 L17.1 24.6 L17.1 35.4 L24.6 42.9 L35.4 42.9 L42.9 35.4 Z
                 M59 30 L42.9 24.6 M59 30 L42.9 35.4 M50.5 9.5 L42.9 24.6 M50.5 9.5 L35.4 17.1
                 M30 1 L35.4 17.1 M30 1 L24.6 17.1 M9.5 9.5 L24.6 17.1 M9.5 9.5 L17.1 24.6
                 M1 30 L17.1 24.6 M1 30 L17.1 35.4 M9.5 50.5 L17.1 35.4 M9.5 50.5 L24.6 42.9
                 M30 59 L24.6 42.9 M30 59 L35.4 42.9 M50.5 50.5 L35.4 42.9 M50.5 50.5 L42.9 35.4"
              fill="none"
              stroke="#fff"
              stroke-opacity=".28"
              stroke-width=".8"
            />
            <path d="M6 18 A27 27 0 0 1 18 6" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="30" cy="30" r="29" fill="none" stroke="url(#plus-rim)" stroke-width="1.6" />
          </svg>
          <app-icon name="plus" />
        </span>
      } @else {
        <app-icon [name]="t.icon" />
        <span>{{ t.label }}</span>
      }
    </a>
  }
</nav>

<!-- Fenêtre de modification d’une opération -->
<app-edit-op-modal />
