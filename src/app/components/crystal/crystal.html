<svg viewBox="40 150 310 545" role="img" [attr.aria-label]="percent() === null ? 'Budget non défini' : percent() + ' % du budget consommé'">
  <defs>
    <radialGradient id="crystal-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" [attr.stop-color]="colors().main" stop-opacity=".5" />
      <stop offset="1" [attr.stop-color]="colors().main" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crystal-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" [attr.stop-color]="colors().light" />
      <stop offset=".25" [attr.stop-color]="colors().main" />
      <stop offset="1" [attr.stop-color]="colors().dark" />
    </linearGradient>
    <linearGradient id="crystal-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".45" [attr.stop-color]="colors().main" />
      <stop offset="1" [attr.stop-color]="colors().dark" />
    </linearGradient>
    <linearGradient id="crystal-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".42" />
      <stop offset="1" stop-color="#000" stop-opacity=".12" />
    </linearGradient>
    <linearGradient id="crystal-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".16" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="crystal-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".35" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="crystal-clip"><path [attr.d]="shape" /></clipPath>
  </defs>

  <!-- Ombre au sol et halo -->
  <ellipse cx="195" cy="668" rx="120" ry="14" fill="#000" opacity=".45" class="c-shadow" />
  <ellipse cx="195" cy="668" rx="150" ry="18" [attr.fill]="colors().main" opacity=".14" class="c-shadow" />
  <circle cx="195" cy="410" [attr.r]="over() ? 230 : 200" fill="url(#crystal-glow)" class="c-glow" [class.fast]="over()" />

  <g class="c-float">
    <g [class.c-shake]="over()">
      <path [attr.d]="shape" [attr.fill]="colors().main" fill-opacity=".1" />
      <g clip-path="url(#crystal-clip)">
        <!-- Liquide : il monte avec les dépenses -->
        <g class="c-level" [style.transform]="'translateY(' + level() + 'px)'">
          <path [attr.d]="back" [attr.fill]="colors().main" opacity=".35" class="c-wave slow" />
          <path [attr.d]="front" fill="url(#crystal-liquid)" opacity=".92" class="c-wave" />
          <path [attr.d]="surface" fill="none" [attr.stroke]="colors().light" stroke-width="2.5" opacity=".9" class="c-wave" />
          <g fill="#fff" opacity=".55" class="c-bubbles">
            <circle cx="160" cy="90" r="3" />
            <circle cx="225" cy="140" r="2" />
            <circle cx="185" cy="190" r="2.5" />
          </g>
        </g>
        <!-- Facettes : faces gauches dans l'ombre, faces droites éclairées -->
        <path d="M195 205 L90 290 L195 330 Z" fill="#fff" opacity=".2" />
        <path d="M195 205 L300 290 L195 330 Z" fill="#fff" opacity=".07" />
        <path d="M90 290 L195 330 L195 560 L90 520 Z" fill="url(#crystal-dark)" />
        <path d="M300 290 L195 330 L195 560 L300 520 Z" fill="url(#crystal-light)" />
        <path d="M90 520 L195 560 L195 615 Z" fill="#000" opacity=".38" />
        <path d="M300 520 L195 560 L195 615 Z" fill="#000" opacity=".15" />
        <!-- Le reflet est incliné par le groupe : l'animation CSS ne touche que son déplacement -->
        <g transform="rotate(18 195 410)">
          <rect x="-60" y="150" width="70" height="520" fill="url(#crystal-sheen)" class="c-sheen" />
        </g>
      </g>
      <path d="M90 290 L195 330 L300 290 M195 330 V615 M90 520 L195 560 L300 520" [attr.stroke]="colors().light" stroke-opacity=".35" fill="none" />
      <path d="M195 205 L90 290" stroke="#fff" stroke-opacity=".75" stroke-width="2" />
      <path d="M96 300 L96 512" stroke="#fff" stroke-opacity=".3" stroke-width="4" stroke-linecap="round" />
      <path [attr.d]="shape" fill="none" stroke="url(#crystal-rim)" stroke-width="2.2" />

      @if (over()) {
        <!-- Fissures et éclats : le cristal menace d'éclater -->
        <g stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9" class="c-cracks">
          <path d="M195 205 L182 262 L204 300 L176 352 L198 392" />
          <path d="M204 300 L246 318 L262 360" />
          <path d="M300 410 L262 430 L270 470 L240 492" />
          <path d="M90 360 L128 384 L118 420" />
          <path d="M176 352 L140 344" />
        </g>
        <g [attr.fill]="colors().main" opacity=".9" class="c-shards">
          <path d="M318 250 l14 -8 l-4 16z" style="--dx: 14px; --dy: -10px" />
          <path d="M70 262 l-12 -10 l2 16z" opacity=".7" style="--dx: -12px; --dy: -8px" />
          <path d="M326 470 l16 4 l-12 10z" opacity=".6" style="--dx: 14px; --dy: 6px" />
          <path d="M60 470 l-14 6 l12 8z" style="--dx: -14px; --dy: 8px" />
          <path d="M226 176 l8 -14 l6 12z" opacity=".7" style="--dx: 4px; --dy: -14px" />
        </g>
      }
    </g>

    <text x="195" y="440" text-anchor="middle" class="c-percent">
      @if (percent() === null) {
        ?
      } @else {
        {{ percent() }}<tspan font-size="36" dy="-30">%</tspan>
      }
    </text>
    <text x="195" y="476" text-anchor="middle" class="c-caption">
      {{ percent() === null ? 'Budget non défini' : over() ? 'Budget dépassé' : 'du budget' }}
    </text>
  </g>
</svg>
