<div class="date-field">
  <input
    type="text"
    [id]="inputId()"
    inputmode="numeric"
    maxlength="10"
    autocomplete="off"
    placeholder="JJ/MM/AAAA"
    [value]="value()"
    [class.invalid]="invalid()"
    [attr.aria-invalid]="invalid()"
    (input)="onInput($event)"
  />
  <button type="button" class="calendar-btn" aria-label="Ouvrir le calendrier" (click)="open()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  </button>
</div>

@if (isOpen()) {
  <div class="modal calendar-modal" (click)="onBackdropClick($event)" (keydown.escape)="onEscape($event)">
    <div class="calendar" role="dialog" aria-modal="true" aria-label="Calendrier">
      <div class="cal-header">
        <button type="button" class="cal-nav" aria-label="Année précédente" [disabled]="!canGoBack()" (click)="shift(-12)">«</button>
        <button type="button" class="cal-nav" aria-label="Mois précédent" [disabled]="!canGoBack()" (click)="shift(-1)">‹</button>
        <div class="cal-title" aria-live="polite">{{ title() }}</div>
        <button type="button" class="cal-nav" aria-label="Mois suivant" (click)="shift(1)">›</button>
        <button type="button" class="cal-nav" aria-label="Année suivante" (click)="shift(12)">»</button>
      </div>

      <div class="cal-weekdays" aria-hidden="true">
        <span>Lu</span><span>Ma</span><span>Me</span><span>Je</span><span>Ve</span><span>Sa</span><span>Di</span>
      </div>

      <div class="cal-grid">
        @for (blank of blanks(); track $index) {
          <span></span>
        }
        @for (d of days(); track d.iso) {
          <button
            type="button"
            class="cal-day"
            [class.today]="d.today"
            [class.selected]="d.selected"
            [attr.aria-label]="d.label"
            (click)="pick(d.iso)"
          >
            {{ d.day }}
          </button>
        }
      </div>

      <div class="cal-footer">
        <button type="button" class="secondary-btn" (click)="pickToday()">Aujourd'hui</button>
        <button type="button" class="secondary-btn" (click)="close()">Fermer</button>
      </div>
    </div>
  </div>
}
